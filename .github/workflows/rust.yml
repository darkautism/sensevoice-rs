name: Rust

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

env:
  CARGO_TERM_COLOR: always
  # Work around missing <cstdint> in kaldi-fbank-rust-kautism 0.1.0
  CXXFLAGS: "-include cstdint"

jobs:
  lock-export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Resolve Cargo.lock without compiling
        run: |
          cargo metadata --format-version 1 > /dev/null
          echo "-----BEGIN-GENERATED-CARGO-LOCK-----"
          cat Cargo.lock
          echo "-----END-GENERATED-CARGO-LOCK-----"
  build:
    if: github.event_name == 'workflow_dispatch'

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - name: RustDoc
      run: cargo doc --verbose
    - name: fmt
      run: cargo fmt --verbose
    - name: Build
      run: cargo build --verbose
