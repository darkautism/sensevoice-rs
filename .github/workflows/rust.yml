name: Rust

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

env:
  CARGO_TERM_COLOR: always
  # Work around missing <cstdint> in kaldi-fbank-rust-kautism 0.1.0
  CXXFLAGS: "-include cstdint"

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - name: RustDoc
      run: cargo doc --locked --verbose
    - name: fmt
      run: cargo fmt --verbose
    - name: Build
      run: cargo build --locked --verbose
